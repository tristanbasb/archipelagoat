# electron-builder configuration (spec §8). Local builds: `npm run dist:win` (Windows) and
# `npm run dist:linux:docker` (Linux, from any system with Docker); artifacts in release/<version>/.
# Publishing only happens in .github/workflows/release.yml (`--publish always` on a v* tag, to a draft
# GitHub release).
appId: com.archipelagoat.app
productName: ArchipelaGOAT
copyright: Copyright © 2026 ArchipelaGOAT contributors. Unofficial Archipelago companion.

directories:
  output: release/${version}
  buildResources: build

# The build output only (electron-vite writes out/; resources/*.json are bundled into it). The
# runtime dependencies are added by electron-builder, minus the ones the renderer bundle already
# holds: out/main/index.js only requires zod, yaml, tar, yauzl, yazl, semver, smol-toml, tough-cookie,
# p-limit and electron-updater (the packaged smoke runs start every build, so a missing one shows).
files:
  - out/**/*
  - '!**/*.map'
  - '!node_modules/@fontsource/**'
  - '!node_modules/@tabler/**'
  - '!node_modules/@tanstack/**'
  - '!node_modules/@babel/runtime/**'
  - '!node_modules/react/**'
  - '!node_modules/react-dom/**'
  - '!node_modules/scheduler/**'
  - '!node_modules/react-router/**'
  - '!node_modules/react-router-dom/**'
  - '!node_modules/cookie/**'
  - '!node_modules/set-cookie-parser/**'
  - '!node_modules/react-i18next/**'
  - '!node_modules/html-parse-stringify/**'
  - '!node_modules/i18next/**'
  - '!node_modules/motion/**'
  - '!node_modules/framer-motion/**'
  - '!node_modules/motion-dom/**'
  - '!node_modules/motion-utils/**'
  - '!node_modules/tslib/**'
  - '!node_modules/zustand/**'
  - '!node_modules/use-sync-external-store/**'
asar: true

# archipelago:// links. Linux registers the handler through the .desktop entry; Windows only when
# the user turns it on in the settings (HKCU, Task 21), never at install time.
protocols:
  - name: Archipelago
    schemes:
      - archipelago

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  # Unsigned in v1: SmartScreen warns (README). A certificate later only needs `win.signtoolOptions`.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ArchipelaGOAT
  uninstallDisplayName: ArchipelaGOAT
  deleteAppDataOnUninstall: false
  artifactName: ArchipelaGOAT-Setup-${version}.${ext}

portable:
  artifactName: ArchipelaGOAT-${version}-portable.${ext}

linux:
  target:
    - AppImage
    - deb
    - tar.gz
  icon: build/icons
  category: Game
  executableName: archipelagoat
  artifactName: ArchipelaGOAT-${version}.${ext}
  synopsis: Unofficial Archipelago companion
  # A deb needs a maintainer; package.json names no author.
  maintainer: ArchipelaGOAT contributors
  # No `mimeTypes`: `protocols` above already gives the .desktop `MimeType=x-scheme-handler/archipelago;`
  # (tests/e2e/linux-smoke.spec.ts checks it), and electron-builder 26 appends each protocol to a
  # `mimeTypes` list once per target, which repeated the type three times.

deb:
  artifactName: archipelagoat_${version}_${arch}.${ext}

# No `publish` here: the release workflow adds `-c.publish.provider=github -c.publish.releaseType=draft`.
# A github provider resolves its repository from the git remote; a local build has none, and
# electron-builder 26 then fails on the update info and writes an app-update.yml without a feed.
# Without the provider, a local build has no app-update.yml at all and its updater stays off.
